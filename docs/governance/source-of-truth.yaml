    status: REVIEW
    reason: "Audit evidence referencing an unavailable Blueprint v6.1, not product authority."
  - id: api-v1-documentation
    path: docs/api/v1.md
    status: APPROVED
    scope: "Narrow operational endpoint-reference documentation only."
    reason: >-
