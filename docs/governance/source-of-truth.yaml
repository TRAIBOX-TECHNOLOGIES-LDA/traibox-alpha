schema_version: 1
governance_id: TRAIBOX-C0.5-SOURCE-OF-TRUTH
status: CANONICAL
owner: "@jeszymczuk"
last_reviewed: "2026-10-22"
activation:
  status_semantics: intended_post_approval
  effective_when: merged_to_main_by_repository_owner
  approval_record: "PR #42"
  draft_branch_authority: false
  rule: >-
    C0.5 statuses and decisions become effective only when the repository owner
    approves and merges PR #42 into main. Before that merge, the C0.1 baseline
    (activated by the merge of PR #38) stays in force on main; the merge of
    PR #42 is the founder approval record for C0.5.

allowed_statuses:
  - CANONICAL
  - APPROVED
  - REVIEW
  - SUPERSEDED
  - ARCHIVED
  - PENDING_IMPORT

rules:
  implementation_authority:
    - CANONICAL
    - APPROVED
  non_authoritative:
    - REVIEW
    - SUPERSEDED
    - ARCHIVED
    - PENDING_IMPORT
  activation_exception: >-
    A non-authoritative source may govern only when an APPROVED governance
    decision or the founder's current brief names and activates a specific
    section.
  missing_source: >-
    A missing or open product source is not a stop condition. Do not fabricate
    product meaning or present a reconstruction as authoritative; make the
    smallest reasonable choice, mark it PROVISIONAL, and list it as an open
    product decision in the pull request (AGENTS.md section 1).
  repository_reality: >-
    Contracts, migrations, routes, and tests reveal implementation reality.
    They are evidence of what exists, not product direction, and they do not
    lock product decisions.
  status_interpretation: >-
    Every status recorded by C0.5 is its intended post-approval status and is
    subject to the top-level activation rule. Product decisions are locked only
    when listed in docs/governance/decision-ledger.md.

precedence:
  - rank: 1
    id: founder-current-brief
    title: "Founder's current brief for the task (issue, PR description, or session instruction)"
    status: CANONICAL
    scope: >-
      Product authority for the task in hand. The latest explicit founder
      statement wins over older documents; a change to a locked decision is
      followed by an update to the decision ledger.
  - rank: 2
    id: decision-ledger
    title: "TRAIBOX Decision Ledger"
    status: CANONICAL
    path: docs/governance/decision-ledger.md
    scope: "The decisions that are actually locked. Anything not listed is open."
  - rank: 3
    id: chapter-0-revised
    title: "Revised Ch.0 — TRAIBOX concept"
    status: PENDING_IMPORT
    path: null
    dependency: >-
      The concept is being redefined. Once the revised Ch.0 is approved and
      imported it becomes the top written product source after the decision
      ledger. Its absence does not block work.
  - rank: 4
    id: blueprint-revised
    title: "Revised and completed Blueprint (successor to v7.0)"
    status: PENDING_IMPORT
    path: null
    dependency: >-
      Product architecture, experience system, screens and roadmap for the
      market-ready product. Its absence does not block work.
  - rank: 5
    id: approved-adrs
    title: "Approved engineering ADRs"
    status: APPROVED
    paths:
      - docs/adrs/ADR-001-fastify-pilot-modular-monolith.md
      - docs/adrs/ADR-002-postgres-utg-pilot-adapter.md
      - docs/adrs/ADR-003-durable-workflow-adoption-trigger.md
      - docs/adrs/ADR-004-nextjs-bff-session-boundary.md
      - docs/adrs/ADR-006-design-system-working-implementation.md
    scope: "Engineering boundaries, independent of the product concept."
  - rank: 6
    id: executable-repository
    title: "Executable repository contracts, migrations, and tests"
    status: APPROVED
    paths:
      - packages/contracts/src/index.ts
      - packages/db/migrations
      - apps/api/src/server.ts
      - apps/api/src/services
      - apps/api/src/domains
      - apps/web/src/app
      - apps/web/src/lib
      - apps/worker/src
      - apps/trade-brain
    scope: "Implementation-reality evidence only; never product direction."
  - rank: 7
    id: blueprint-v6-v7-chapters
    title: "Blueprint v6.1 and v7.0 chapters (Ch.0–Ch.34, Product Architecture v6.1, v7 Pilot-Ready Cut, Ch.17 v3, Ch.17.A)"
    status: SUPERSEDED
    path: null
    scope: >-
      Context and vocabulary only. These chapters were never imported into the
      repository and are being revised; they are not requirements and do not
      block work.

repository_governance:
  - id: repository-constitution
    path: docs/governance/repository-constitution.md
    status: CANONICAL
    scope: "Repository governance and C0.1 architecture clarifications."
  - id: adr-index
    path: docs/adrs/README.md
    status: APPROVED
    scope: "Index of approved architecture decisions."
  - id: adr-001
    path: docs/adrs/ADR-001-fastify-pilot-modular-monolith.md
    status: APPROVED
    scope: "Fastify pilot modular monolith and measurable NestJS reconsideration triggers."
  - id: adr-002
    path: docs/adrs/ADR-002-postgres-utg-pilot-adapter.md
    status: APPROVED
    scope: "PostgreSQL UTG adapter and derived-only graph adoption triggers."
  - id: adr-003
    path: docs/adrs/ADR-003-durable-workflow-adoption-trigger.md
    status: APPROVED
    scope: "Current worker boundary and mandatory durable-workflow triggers."
  - id: adr-004
    path: docs/adrs/ADR-004-nextjs-bff-session-boundary.md
    status: APPROVED
    scope: "Intended authenticated browser, BFF, and secure session boundary."
  - id: adr-005
    path: docs/adrs/ADR-005-design-system-v2.md
    status: SUPERSEDED
    scope: "Former Design System v2 lock; superseded by ADR-006."
  - id: adr-006
    path: docs/adrs/ADR-006-design-system-working-implementation.md
    status: APPROVED
    scope: "Design System v2 as working implementation; visual language open to the founder's design brief."
  - id: route-manifest
    path: docs/governance/route-manifest.yaml
    status: APPROVED
    scope: "Observed route reality and compatibility disposition; not a redirect authorization."
  - id: protected-actions-manifest
    path: docs/governance/protected-actions.yaml
    status: APPROVED
    scope: "Observed protected-action evidence and discrepancies; not execution permission."
  - id: status-vocabulary
    path: docs/governance/status-vocabulary.yaml
    status: APPROVED
    scope: "Observed domain vocabularies and unresolved collisions."

