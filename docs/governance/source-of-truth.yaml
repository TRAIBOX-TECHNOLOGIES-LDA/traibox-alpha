  - id: concierge-pipeline-design
    path: docs/concierge-pipeline-design.md
    status: REVIEW
    reason: "Document declares itself proposed and not implemented."
  - id: pulse-connectors-design
    path: docs/pulse-connectors-design.md
    status: REVIEW
    reason: "Document declares itself proposed and not implemented."
  - id: c0-2-structural-conformance-evidence
    paths:
      - docs/audits/component-token-conformance.md
      - docs/governance/structural-conformance.md
      - scripts/conformance/registries/api-server-evidence.yaml
      - scripts/conformance/registries/design-token-contract.yaml
      - scripts/conformance/registries/status-sources.yaml
      - scripts/conformance/baselines/api-catalog-debt.json
      - scripts/conformance/baselines/component-token-debt.json
      - scripts/conformance/baselines/eslint-debt.json
      - scripts/conformance/baselines/status-vocabulary-debt.json
